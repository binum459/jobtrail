<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#115e59"/>
      <stop offset="0.55" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="0.6" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </radialGradient>
    <radialGradient id="sphere2" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="0.6" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="600" height="720" fill="url(#bg)"/>
  <path d="M600 0v260c-70 30-130 10-180-40s-60-130-20-220z" fill="#ffffff" opacity="0.08"/>
  <path d="M0 720V470c80-20 150 10 190 70s30 120 10 180z" fill="#ffffff" opacity="0.08"/>
  <path d="M-40 160c90-60 190-30 230 40s-10 150-90 170-170-20-190-80z" fill="#ffffff" opacity="0.05"/>

  <!-- floating spheres -->
  <circle cx="470" cy="150" r="58" fill="url(#sphere)" opacity="0.95"/>
  <circle cx="95" cy="610" r="34" fill="url(#sphere2)" opacity="0.9"/>
  <circle cx="530" cy="560" r="14" fill="#ccfbf1" opacity="0.7"/>
  <circle cx="120" cy="230" r="9" fill="#ccfbf1" opacity="0.6"/>

  <!-- kanban board panel -->
  <g filter="url(#shadow)">
    <rect x="70" y="300" width="460" height="290" rx="22" fill="#ffffff"/>
  </g>
  <rect x="70" y="300" width="460" height="46" rx="22" fill="#f0fdfa"/>
  <rect x="70" y="324" width="460" height="22" fill="#f0fdfa"/>
  <circle cx="96" cy="323" r="6" fill="#f87171"/>
  <circle cx="116" cy="323" r="6" fill="#fbbf24"/>
  <circle cx="136" cy="323" r="6" fill="#34d399"/>

  <!-- column 1: wishlist -->
  <rect x="92" y="362" width="130" height="24" rx="12" fill="#e0e7ff"/>
  <circle cx="106" cy="374" r="5" fill="#6366f1"/>
  <text x="118" y="379" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" fill="#4338ca">Wishlist</text>
  <rect x="92" y="398" width="130" height="62" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="104" y="412" width="80" height="8" rx="4" fill="#334155"/>
  <rect x="104" y="428" width="104" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="104" y="442" width="60" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="92" y="470" width="130" height="62" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="104" y="484" width="66" height="8" rx="4" fill="#334155"/>
  <rect x="104" y="500" width="96" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="104" y="514" width="50" height="6" rx="3" fill="#cbd5e1"/>

  <!-- column 2: applied -->
  <rect x="235" y="362" width="130" height="24" rx="12" fill="#dbeafe"/>
  <circle cx="249" cy="374" r="5" fill="#3b82f6"/>
  <text x="261" y="379" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Applied</text>
  <rect x="235" y="398" width="130" height="62" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="247" y="412" width="90" height="8" rx="4" fill="#334155"/>
  <rect x="247" y="428" width="100" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="247" y="442" width="70" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="235" y="470" width="130" height="62" rx="10" fill="none" stroke="#99f6e4" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- column 3: interview -->
  <rect x="378" y="362" width="130" height="24" rx="12" fill="#fef3c7"/>
  <circle cx="392" cy="374" r="5" fill="#f59e0b"/>
  <text x="404" y="379" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" fill="#b45309">Interview</text>
  <rect x="378" y="398" width="130" height="62" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="390" y="412" width="74" height="8" rx="4" fill="#334155"/>
  <rect x="390" y="428" width="98" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="390" y="442" width="56" height="6" rx="3" fill="#cbd5e1"/>

  <!-- dragged offer card -->
  <g transform="rotate(-7 420 250)" filter="url(#shadow)">
    <rect x="330" y="200" width="190" height="92" rx="14" fill="#ffffff"/>
    <rect x="346" y="216" width="72" height="22" rx="11" fill="#dcfce7"/>
    <circle cx="359" cy="227" r="5" fill="#16a34a"/>
    <text x="370" y="232" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d">Offer</text>
    <rect x="346" y="250" width="110" height="9" rx="4.5" fill="#0f172a"/>
    <rect x="346" y="267" width="140" height="7" rx="3.5" fill="#cbd5e1"/>
    <circle cx="492" cy="230" r="15" fill="#16a34a"/>
    <path d="M485 230l5 5 9-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- briefcase badge -->
  <g filter="url(#shadow)">
    <circle cx="150" cy="268" r="34" fill="#ffffff"/>
  </g>
  <rect x="133" y="261" width="34" height="24" rx="5" fill="#0d9488"/>
  <path d="M143 261v-4a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4" fill="none" stroke="#0d9488" stroke-width="3"/>
  <path d="M140 273l6 6 11-11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
